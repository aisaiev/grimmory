<ng-container *transloco="let t; prefix: 'book.isbnScanner'">
  <div class="scanner-controls">
    @if (!cameraPermissionApproved() && !isScanning()) {
      <p-button
        [label]="t('requestCameraPermission')"
        icon="pi pi-camera"
        severity="primary"
        (onClick)="requestCameraPermission()"/>
    }
    @if (cameraPermissionApproved() && cameras().length > 1 && !isScanning()) {
      <p-select
        [ngModel]="selectedCameraId()"
        (ngModelChange)="selectedCameraId.set($event)"
        [options]="cameras()"
        optionLabel="label"
        optionValue="deviceId"
        [placeholder]="t('selectCamera')"
        class="camera-select"/>
    }
    @if (cameraPermissionApproved() && !isScanning()) {
      <p-button
        [label]="t('startScanning')"
        icon="pi pi-camera"
        severity="primary"
        (onClick)="startScanning()"
        [disabled]="!selectedCameraId()"/>
    }
    @if (isScanning()) {
      <p-button
        [label]="t('stopScanning')"
        icon="pi pi-stop-circle"
        severity="danger"
        (onClick)="stopScanning()"/>
    }
  </div>

  <video
    #videoElement
    class="isbn-scanner-container"
    playsinline
    autoplay
    muted
    [hidden]="!isScanning()"
    [class.scan-success]="scanSuccess()">
  </video>
</ng-container>
